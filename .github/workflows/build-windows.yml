name: Compilar para Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (baja JUCE automáticamente)
        run: cmake -B build -A x64

      - name: Pruebas del motor DSP
        run: |
          cmake --build build --config Release --target engine_tests
          ./build/Release/engine_tests.exe

      - name: Compilar VST3 y Standalone
        run: cmake --build build --config Release --target PVRVoiceMorph_VST3 PVRVoiceMorph_Standalone

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/PVRVoiceMorph_artefacts/Release/VST3/PVR VoiceMorph.vst3" -DestinationPath "dist/PVR-VoiceMorph-VST3-Windows.zip"
          Compress-Archive -Path "build/PVRVoiceMorph_artefacts/Release/Standalone/*" -DestinationPath "dist/PVR-VoiceMorph-Standalone-Windows.zip"

      - name: Subir el plugin (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: PVR-VoiceMorph-Windows
          path: dist/*.zip

      - name: Leer versión de CMakeLists.txt
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(PVRVoiceMorph VERSION ([0-9.]+)'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Publicar Release (solo desde main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PVR VoiceMorph v${{ steps.ver.outputs.version }}
          files: dist/*.zip
          body: |
            **Instalación**
            1. Descomprimí `PVR-VoiceMorph-VST3-Windows.zip`.
            2. Copiá la carpeta `PVR VoiceMorph.vst3` a `C:\Program Files\Common Files\VST3\`.
            3. En Ableton: Preferencias → Plug-Ins → activá "Use VST3 Plug-In System Folders" → Rescan.

            La versión standalone (`.exe`) sirve para usarlo con el micrófono sin abrir un DAW.
            Guía completa en el README.
